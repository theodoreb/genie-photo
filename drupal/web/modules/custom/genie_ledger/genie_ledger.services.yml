services:
  _defaults:
    autowire: true

  logger.channel.genie_ledger:
    parent: logger.channel_base
    arguments: ['genie_ledger']
  genie_ledger.mcp_route_subscriber:
    class: Drupal\genie_ledger\Web\McpRouteSubscriber
    autowire: false
    tags:
      - { name: event_subscriber }
  Symfony\AI\Platform\StructuredOutput\PlatformSubscriber:
    autowire: false
    tags:
      - { name: event_subscriber }
  Symfony\AI\Platform\StructuredOutput\Validator\ValidatorSubscriber:
    autowire: false
    tags:
      - { name: event_subscriber }
  Drupal\genie_ledger\Game\Approvals: ~
  Drupal\genie_ledger\Game\CurrentGame: ~
  Drupal\genie_ledger\Photo\Darkroom: ~
  Drupal\genie_ledger\Game\Exports: ~
  Drupal\genie_ledger\Wish\Framer: ~
  Drupal\genie_ledger\Game\GameView: ~
  Drupal\genie_ledger\Game\Games: ~
  Drupal\genie_ledger\Wish\KeywordInterpreter: ~
  Drupal\genie_ledger\Game\Ledger: ~
  Drupal\genie_ledger\Photo\People: ~
  Drupal\genie_ledger\Photo\PersonDetector: ~
  Drupal\genie_ledger\Photo\PhotoIntake: ~
  Drupal\genie_ledger\Photo\PhotoStore: ~
  Drupal\genie_ledger\Photo\Pictures: ~
  Drupal\genie_ledger\Game\RevisionPublisher: ~
  Drupal\genie_ledger\Web\WebViewAddress: ~
  Drupal\genie_ledger\Wish\WishInterpreter: ~
  Drupal\genie_ledger\Wish\Wishes: ~
