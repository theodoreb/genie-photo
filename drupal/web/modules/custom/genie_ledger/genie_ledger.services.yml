services:
  _defaults:
    autowire: true

  logger.channel.genie_ledger:
    parent: logger.channel_base
    arguments: ['genie_ledger']
  genie_ledger.mcp_route_subscriber:
    class: Drupal\genie_ledger\Routing\McpRouteSubscriber
    autowire: false
    tags:
      - { name: event_subscriber }
  Symfony\AI\Platform\StructuredOutput\PlatformSubscriber:
    autowire: false
    tags:
      - { name: event_subscriber }
  Symfony\AI\Platform\StructuredOutput\Validator\ValidatorSubscriber:
    autowire: false
    tags:
      - { name: event_subscriber }
  Drupal\genie_ledger\CurrentGame: ~
  Drupal\genie_ledger\Darkroom: ~
  Drupal\genie_ledger\Exports: ~
  Drupal\genie_ledger\Framer: ~
  Drupal\genie_ledger\Games: ~
  Drupal\genie_ledger\KeywordInterpreter: ~
  Drupal\genie_ledger\Ledger: ~
  Drupal\genie_ledger\PersonDetector: ~
  Drupal\genie_ledger\PhotoIntake: ~
  Drupal\genie_ledger\PhotoStore: ~
  Drupal\genie_ledger\RevisionPublisher: ~
  Drupal\genie_ledger\WishDesk: ~
  Drupal\genie_ledger\WishInterpreter: ~
  Drupal\genie_ledger\WebViewAddress: ~
