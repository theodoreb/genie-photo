security:
    providers:
        players:
            id: App\Security\PlayerProvider

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: players
            custom_authenticators:
                - App\Security\DrupalAuthenticator
            entry_point: App\Security\DrupalAuthenticator
            logout:
                path: app_logout
                target: app_games
                enable_csrf: true

    access_control:
        - { path: ^/(login|oauth/callback)$, roles: PUBLIC_ACCESS }
        # Anyone looks at the games and reads the guide for agents. The home page sends a visitor to the list.
        - { path: ^/(games(/|$)|llms\.txt$|$), roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_PLAYER }
