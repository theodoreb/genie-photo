name: 'Genie site'
type: Site
description: 'Accounts, OAuth and the ledger behind the genie photo.'
install:
  - automated_cron
  - mcp_server
  - mcp_server_oauth
  - simple_oauth
  - simple_oauth_pkce
  - simple_oauth_server_metadata
  - simple_oauth_client_registration
  - ai
  - genie
config:
  import:
    simple_oauth: '*'
    simple_oauth_pkce: '*'
    simple_oauth_server_metadata: '*'
    simple_oauth_client_registration: '*'
    mcp_server: '*'
    mcp_server_oauth: '*'
    ai: '*'
    key: '*'
    genie: '*'
  actions:
    automated_cron.settings:
      simpleConfigUpdate:
        interval: 3600
    simple_oauth.settings:
      simpleConfigUpdate:
        disable_openid_connect: true
    simple_oauth_pkce.settings:
      simpleConfigUpdate:
        plain_enabled: false
