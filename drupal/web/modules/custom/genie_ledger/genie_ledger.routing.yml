genie_ledger.photo_put:
  path: '/genie/photo'
  methods: [PUT]
  defaults:
    _controller: Drupal\genie_ledger\Controller\PhotoController::put
  requirements:
    _permission: 'play genie'
  options:
    _auth: ['oauth2']
    no_cache: TRUE

genie_ledger.photo_get:
  path: '/genie/photo'
  methods: [GET]
  defaults:
    _controller: Drupal\genie_ledger\Controller\PhotoController::get
  requirements:
    _permission: 'play genie'
  options:
    _auth: ['oauth2']
    no_cache: TRUE
